<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b98cff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#7a3cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3a0f8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#f1e4ff"/>
      <stop offset="0.45" stop-color="#b47bff"/>
      <stop offset="0.78" stop-color="#6a26e6"/>
      <stop offset="1" stop-color="#2e0b78"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd4ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <linearGradient id="red" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9aa4"/>
      <stop offset="1" stop-color="#ff2a44"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="116" fill="url(#glow)"/>
  <!-- blue and red streams spiralling into the purple core -->
  <path d="M28 96 C 44 40, 128 22, 170 58 C 196 80, 192 112, 168 122" fill="none" stroke="url(#blue)" stroke-width="14" stroke-linecap="round" filter="url(#soft)" opacity="0.95"/>
  <path d="M212 144 C 196 200, 112 218, 70 182 C 44 160, 48 128, 72 118" fill="none" stroke="url(#red)" stroke-width="14" stroke-linecap="round" filter="url(#soft)" opacity="0.95"/>
  <path d="M40 92 C 58 52, 124 38, 160 66" fill="none" stroke="#e8f4ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M200 148 C 182 188, 116 202, 80 174" fill="none" stroke="#ffe8eb" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="120" cy="120" r="54" fill="url(#core)"/>
  <circle cx="120" cy="120" r="54" fill="none" stroke="#e9d8ff" stroke-width="2" opacity="0.7"/>
  <ellipse cx="104" cy="100" rx="16" ry="10" fill="#ffffff" opacity="0.55" transform="rotate(-30 104 100)"/>
</svg>
